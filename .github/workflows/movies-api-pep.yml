name: movies-api-pep

on:
  pull_request:
    paths:
      - "**/*.py"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".pre-commit-config.yaml"
      - ".github/workflows/movies-api-pep.yml"
  push:
    paths:
      - "**/*.py"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".pre-commit-config.yaml"
      - ".github/workflows/movies-api-pep.yml"

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development requirements
        run: pip install -r requirements-dev.txt

      - name: Check formatting
        run: ruff format --check .

      - name: Run lint
        run: ruff check .

  unit-tests:
    runs-on: ubuntu-latest
    needs: ruff

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test requirements
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest tests/test_sentry.py
